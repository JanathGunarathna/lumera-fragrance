# ===== Server =====
server.port=8080

# ===== MySQL Database =====
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/lumera_db?useSSL=true&serverTimezone=UTC&createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:admin}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===== JPA / Hibernate =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.sql.init.mode=always

# ===== JWT =====
app.jwt.secret=${JWT_SECRET:ChangeThisSuperSecretKeyForLumeraFragranceJWTAuth2026MinLength256Bits}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ===== File upload (product images) =====
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
app.upload.dir=${UPLOAD_DIR:uploads/products}

# ===== CORS =====
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# ===== PayHere =====
# Use sandbox during development and the live URL only for production.
app.payhere.checkout-url=${PAYHERE_CHECKOUT_URL:https://sandbox.payhere.lk/pay/checkout}
app.payhere.merchant-id=${PAYHERE_MERCHANT_ID:}
app.payhere.merchant-secret=${PAYHERE_MERCHANT_SECRET:}
app.payhere.currency=${PAYHERE_CURRENCY:USD}
# {orderId} is replaced by the backend at runtime.
app.payhere.return-url=${PAYHERE_RETURN_URL:http://localhost:5173/payment/success?orderId={orderId}}
app.payhere.cancel-url=${PAYHERE_CANCEL_URL:http://localhost:5173/payment/cancel?orderId={orderId}}
# This URL MUST be publicly reachable by PayHere; localhost will not receive callbacks.
app.payhere.notify-url=${PAYHERE_NOTIFY_URL:http://localhost:8080/api/payments/payhere/notify}
