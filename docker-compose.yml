services:
  mysql:
    image: mysql:8.4
    container_name: lumera-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: lumera_db
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-change-root-password}
      MYSQL_USER: ${DB_USERNAME:-lumera}
      MYSQL_PASSWORD: ${DB_PASSWORD:-change-db-password}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 12

  backend:
    build:
      context: ./backend
    container_name: lumera-backend
    restart: unless-stopped
    environment:
      DB_URL: jdbc:mysql://mysql:3306/lumera_db?useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true
      DB_USERNAME: ${DB_USERNAME:-lumera}
      DB_PASSWORD: ${DB_PASSWORD:-change-db-password}
      JWT_SECRET: ${JWT_SECRET:-replace-with-a-long-random-secret}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost}
      PAYHERE_MERCHANT_ID: ${PAYHERE_MERCHANT_ID:-}
      PAYHERE_MERCHANT_SECRET: ${PAYHERE_MERCHANT_SECRET:-}
      PAYHERE_CURRENCY: ${PAYHERE_CURRENCY:-USD}
      PAYHERE_CHECKOUT_URL: ${PAYHERE_CHECKOUT_URL:-https://sandbox.payhere.lk/pay/checkout}
      PAYHERE_RETURN_URL: ${PAYHERE_RETURN_URL:-http://localhost/payment/success?orderId={orderId}}
      PAYHERE_CANCEL_URL: ${PAYHERE_CANCEL_URL:-http://localhost/payment/cancel?orderId={orderId}}
      PAYHERE_NOTIFY_URL: ${PAYHERE_NOTIFY_URL:-http://localhost/api/payments/payhere/notify}
      UPLOAD_DIR: /app/uploads/products
    volumes:
      - lumera_uploads:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    container_name: lumera-frontend
    restart: unless-stopped
    ports:
      - "${APP_PORT:-80}:80"
    depends_on:
      - backend

volumes:
  mysql_data:
  lumera_uploads:
